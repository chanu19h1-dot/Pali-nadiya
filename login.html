<!DOCTYPE html><!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Chanu Study | Login</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  min-height:100vh;
  background:linear-gradient(135deg,#eef4ff,#f8fbff);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.container{
  width:100%;
  max-width:430px;
}

.brand{
  text-align:center;
  margin-bottom:20px;
}

.logo{
  width:64px;
  height:64px;
  margin:auto;
  border-radius:20px;
  background:linear-gradient(135deg,#315bea,#7048e8);
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:25px;
  font-weight:bold;
  box-shadow:0 10px 25px #315bea40;
}

.brand h1{
  margin-top:12px;
  color:#172033;
  font-size:27px;
}

.brand p{
  color:#788196;
  margin-top:5px;
  font-size:14px;
}

.card{
  background:white;
  border-radius:25px;
  padding:25px;
  box-shadow:0 15px 45px #18284818;
}

.tabs{
  display:flex;
  background:#f1f4fa;
  padding:5px;
  border-radius:13px;
  margin-bottom:22px;
}

.tabs button{
  width:50%;
  border:0;
  padding:12px;
  border-radius:10px;
  background:transparent;
  font-weight:bold;
  color:#737b8c;
  cursor:pointer;
}

.tabs button.active{
  background:white;
  color:#315bea;
  box-shadow:0 3px 10px #00000010;
}

.form{
  display:none;
}

.form.active{
  display:block;
}

label{
  display:block;
  margin:14px 0 7px;
  font-size:13px;
  font-weight:bold;
  color:#343c4d;
}

input,select{
  width:100%;
  padding:14px;
  border:1px solid #e0e5ee;
  border-radius:12px;
  outline:none;
  font-size:14px;
  background:#fafbfe;
}

input:focus,select:focus{
  border-color:#315bea;
  background:white;
}

.role-box{
  display:flex;
  gap:10px;
}

.role{
  flex:1;
  border:1px solid #e0e5ee;
  border-radius:13px;
  padding:13px;
  text-align:center;
  cursor:pointer;
  color:#667085;
  font-size:14px;
}

.role.selected{
  border-color:#315bea;
  background:#eef3ff;
  color:#315bea;
  font-weight:bold;
}

.main-btn{
  width:100%;
  border:0;
  padding:15px;
  margin-top:20px;
  border-radius:13px;
  background:linear-gradient(135deg,#315bea,#7048e8);
  color:white;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
  box-shadow:0 8px 20px #315bea35;
}

.main-btn:active{
  transform:scale(.98);
}

.forgot{
  text-align:right;
  margin-top:10px;
  color:#315bea;
  font-size:13px;
  cursor:pointer;
}

.note{
  margin-top:18px;
  padding:12px;
  background:#f6f8fc;
  border-radius:12px;
  text-align:center;
  font-size:12px;
  color:#7b8496;
}

.message{
  display:none;
  margin-top:15px;
  padding:12px;
  border-radius:10px;
  text-align:center;
  font-size:13px;
  background:#eaf8ef;
  color:#238044;
}
</style>
</head>

<body>

<div class="container">

  <div class="brand">
    <div class="logo">CS</div>
    <h1>Chanu Study</h1>
    <p>Learn • Practice • Grow</p>
  </div>

  <div class="card">

    <div class="tabs">
      <button class="active" onclick="showForm('login',this)">Login</button>
      <button onclick="showForm('signup',this)">Create Account</button>
    </div>

    <!-- LOGIN -->

    <div id="login" class="form active">

      <label>Email / Mobile</label>
      <input id="loginId" type="text" placeholder="Enter email or mobile">

      <label>Password</label>
      <input id="loginPassword" type="password" placeholder="Enter password">

      <div class="forgot" onclick="forgotPassword()">
        Forgot Password?
      </div>

      <button class="main-btn" onclick="loginUser()">
        Login to Chanu Study
      </button>

    </div>

    <!-- SIGNUP -->

    <div id="signup" class="form">

      <label>Full Name</label>
      <input id="name" type="text" placeholder="Enter your full name">

      <label>Mobile / Email</label>
      <input id="email" type="text" placeholder="Enter mobile or email">

      <label>Select Your Role</label>

      <div class="role-box">

        <div class="role selected" id="studentRole"
             onclick="selectRole('Student')">
          👨‍🎓<br>Student
        </div>

        <div class="role" id="teacherRole"
             onclick="selectRole('Teacher')">
          👨‍🏫<br>Teacher
        </div>

      </div>

      <input type="hidden" id="role" value="Student">

      <div id="classBox">

        <label>Class</label>

        <select id="className">
          <option value="">Select Class</option>
          <option>Class 6</option>
          <option>Class 7</option>
          <option>Class 8</option>
          <option>Class 9</option>
          <option>Class 10</option>
          <option>Class 11</option>
          <option>Class 12</option>
          <option>College</option>
          <option>Other</option>
        </select>

      </div>

      <label>Create Password</label>
      <input id="password" type="password" placeholder="Create password">

      <label>Confirm Password</label>
      <input id="confirmPassword" type="password" placeholder="Confirm password">

      <button class="main-btn" onclick="createAccount()">
        Create Account
      </button>

    </div>

    <div id="message" class="message"></div>

    <div class="note">
      🔒 Your account information is stored only in this demo on this device.
    </div>

  </div>

</div>


<script>

let selectedRole = "Student";


function showForm(type,button){

  document.querySelectorAll(".form")
    .forEach(form => form.classList.remove("active"));

  document.getElementById(type).classList.add("active");

  document.querySelectorAll(".tabs button")
    .forEach(btn => btn.classList.remove("active"));

  button.classList.add("active");

  hideMessage();
}


function selectRole(role){

  selectedRole = role;

  document.getElementById("role").value = role;

  document.getElementById("studentRole")
    .classList.remove("selected");

  document.getElementById("teacherRole")
    .classList.remove("selected");

  if(role === "Student"){

    document.getElementById("studentRole")
      .classList.add("selected");

    document.getElementById("classBox")
      .style.display = "block";

  }else{

    document.getElementById("teacherRole")
      .classList.add("selected");

    document.getElementById("classBox")
      .style.display = "none";

  }
}


function createAccount(){

  const name =
    document.getElementById("name").value.trim();

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  const confirm =
    document.getElementById("confirmPassword").value;

  const className =
    document.getElementById("className").value;


  if(!name || !email || !password || !confirm){

    showMessage("⚠️ Please fill all required fields.");
    return;
  }


  if(selectedRole === "Student" && !className){

    showMessage("⚠️ Please select your class.");
    return;
  }


  if(password.length < 6){

    showMessage("⚠️ Password must contain at least 6 characters.");
    return;
  }


  if(password !== confirm){

    showMessage("⚠️ Passwords do not match.");
    return;
  }


  const user = {

    name:name,
    email:email,
    role:selectedRole,
    className:className,
    password:password

  };


  localStorage.setItem("chanuStudyUser",
                       JSON.stringify(user));


  showMessage("✅ Account created successfully!");


  setTimeout(()=>{

    document.querySelector(".tabs button").click();

  },1000);

}


function loginUser(){

  const id =
    document.getElementById("loginId").value.trim();

  const password =
    document.getElementById("loginPassword").value;


  const saved =
    localStorage.getItem("chanuStudyUser");


  if(!saved){

    showMessage("⚠️ No account found. Please create an account first.");
    return;
  }


  const user = JSON.parse(saved);


  if((id === user.email) &&
     (password === user.password)){

    localStorage.setItem(
      "chanuStudyLoggedIn",
      "true"
    );


    showMessage(
      "✅ Login successful! Welcome " + user.name
    );


    setTimeout(()=>{

      if(user.role === "Teacher"){

        window.location.href =
          "teacher.html";

      }else{

        window.location.href =
          "index.html";

      }

    },1000);


  }else{

    showMessage(
      "❌ Email/Mobile या Password गलत है."
    );

  }

}


function forgotPassword(){

  showMessage(
    "ℹ️ Demo version: Password recovery will be connected with OTP later."
  );

}


function showMessage(text){

  const box =
    document.getElementById("message");

  box.innerText = text;
  box.style.display = "block";

}


function hideMessage(){

  document.getElementById("message")
    .style.display = "none";

}

</script>

</body>
</html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>

</html>
