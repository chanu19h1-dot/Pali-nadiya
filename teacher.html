<!DOCTYPE html><!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Teacher Dashboard | Chanu Study</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  background:#f4f7fb;
  color:#172033;
}

/* HEADER */
.header{
  background:linear-gradient(135deg,#4f46e5,#7c3aed);
  color:white;
  padding:22px 18px 30px;
  border-radius:0 0 28px 28px;
}

.header-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.header h1{
  font-size:23px;
}

.header p{
  margin-top:6px;
  opacity:.85;
  font-size:13px;
}

.bell{
  width:42px;
  height:42px;
  border-radius:50%;
  background:rgba(255,255,255,.18);
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:20px;
}

/* PROFILE */
.profile{
  background:white;
  margin:-18px 16px 18px;
  padding:17px;
  border-radius:18px;
  box-shadow:0 5px 20px rgba(0,0,0,.08);
  display:flex;
  align-items:center;
  gap:13px;
}

.avatar{
  width:52px;
  height:52px;
  border-radius:50%;
  background:linear-gradient(135deg,#6366f1,#8b5cf6);
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:22px;
  font-weight:bold;
}

.profile h3{
  font-size:17px;
}

.profile span{
  font-size:12px;
  color:#777;
}

/* STATS */
.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  padding:0 16px;
}

.stat{
  background:white;
  padding:15px 8px;
  border-radius:16px;
  text-align:center;
  box-shadow:0 3px 12px rgba(0,0,0,.05);
}

.stat strong{
  display:block;
  font-size:21px;
  color:#4f46e5;
}

.stat span{
  font-size:11px;
  color:#777;
}

/* SECTION */
.section{
  padding:22px 16px 0;
}

.section-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:12px;
}

.section-title h2{
  font-size:18px;
}

.section-title small{
  color:#4f46e5;
}

/* CARDS */
.card{
  background:white;
  padding:17px;
  border-radius:18px;
  margin-bottom:12px;
  box-shadow:0 4px 15px rgba(0,0,0,.06);
}

.group-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.group-icon{
  width:45px;
  height:45px;
  border-radius:13px;
  background:#eef2ff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:22px;
}

.group-info{
  flex:1;
  margin-left:12px;
}

.group-info h3{
  font-size:16px;
}

.group-info p{
  color:#777;
  font-size:12px;
  margin-top:4px;
}

.status{
  background:#dcfce7;
  color:#15803d;
  padding:5px 9px;
  border-radius:20px;
  font-size:10px;
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:14px;
}

button{
  border:0;
  padding:11px;
  border-radius:11px;
  font-weight:bold;
  cursor:pointer;
}

.primary{
  background:#4f46e5;
  color:white;
}

.light{
  background:#eef2ff;
  color:#4338ca;
}

.danger{
  background:#fee2e2;
  color:#dc2626;
}

/* REQUEST */
.request{
  display:flex;
  align-items:center;
  gap:11px;
}

.student{
  width:42px;
  height:42px;
  border-radius:50%;
  background:#e0e7ff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
  color:#4338ca;
}

.request-info{
  flex:1;
}

.request-info h4{
  font-size:14px;
}

.request-info p{
  font-size:11px;
  color:#888;
  margin-top:3px;
}

.request-buttons{
  display:flex;
  gap:5px;
}

.request-buttons button{
  padding:8px 10px;
  font-size:11px;
}

/* MENU */
.menu{
  padding:22px 16px 35px;
}

.menu-item{
  background:white;
  margin-bottom:9px;
  padding:15px;
  border-radius:15px;
  display:flex;
  align-items:center;
  gap:13px;
  box-shadow:0 3px 12px rgba(0,0,0,.04);
}

.menu-icon{
  width:40px;
  height:40px;
  border-radius:11px;
  background:#f1f5f9;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:19px;
}

.menu-item div:nth-child(2){
  flex:1;
}

.menu-item h4{
  font-size:14px;
}

.menu-item p{
  font-size:11px;
  color:#888;
  margin-top:3px;
}

.arrow{
  color:#999;
}

/* MODAL */
.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  align-items:flex-end;
  justify-content:center;
  z-index:10;
}

.modal-box{
  width:100%;
  max-width:500px;
  background:white;
  padding:22px;
  border-radius:25px 25px 0 0;
}

.modal-box h2{
  margin-bottom:15px;
}

.input{
  width:100%;
  padding:13px;
  border:1px solid #ddd;
  border-radius:11px;
  margin-bottom:10px;
  outline:none;
}

.close{
  background:#eee;
  color:#333;
  width:100%;
  margin-top:8px;
}

@media(min-width:600px){
  body{
    max-width:520px;
    margin:auto;
  }
}
</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
  <div class="header-top">
    <div>
      <h1>Teacher Dashboard 👨‍🏫</h1>
      <p>Chanu Study • Manage your classes</p>
    </div>

    <div class="bell" onclick="showNotification()">
      🔔
    </div>
  </div>
</div>

<!-- PROFILE -->
<div class="profile">
  <div class="avatar">T</div>

  <div>
    <h3>Teacher Account</h3>
    <span>Verified Teacher • Chanu Study</span>
  </div>
</div>

<!-- STATS -->
<div class="stats">

  <div class="stat">
    <strong id="groupCount">3</strong>
    <span>Groups</span>
  </div>

  <div class="stat">
    <strong id="studentCount">86</strong>
    <span>Students</span>
  </div>

  <div class="stat">
    <strong id="doubtCount">12</strong>
    <span>Doubts</span>
  </div>

</div>
